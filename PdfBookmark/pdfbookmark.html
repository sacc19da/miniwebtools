<!DOCTYPE html>
<html lang="zh-TW">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PDF 書籤編輯工具</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.10.377/pdf.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      height: 100vh;
      box-sizing: border-box;
    }

    #container {
      display: flex;
      flex-grow: 1;
      overflow: hidden;
    }

    #bookmark-panel {
      width: 30%;
      max-width: 400px;
      min-width: 250px;
      border-right: 1px solid #ccc;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
    }

    #bookmark-header {
      padding: 10px;
      border-bottom: 1px solid #ccc;
      display: flex;
      flex-direction: column;
    }

    #bookmark-header input {
      margin-bottom: 5px;
    }

    #bookmark-list-container {
      flex-grow: 1;
      overflow-y: auto;
      padding: 10px;
      box-sizing: border-box;
    }

    #bookmark-list {
      list-style-type: none;
      padding: 0;
    }

    .bookmark-item {
      padding: 5px;
      border: 1px solid #ddd;
      border-radius: 5px;
      margin-bottom: 5px;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .bookmark-item .controls button {
      margin-left: 5px;
    }

    #pdf-preview {
      flex-grow: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 10px;
      box-sizing: border-box;
    }

    #pdf-canvas-container {
      flex-grow: 1;
      width: 100%;
      overflow: auto;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #pdf-canvas {
      border: 1px solid #ddd;
      max-width: 90%;
    }

    #toolbar {
      width: 100%;
      display: flex;
      justify-content: space-between;
      padding: 10px;
      box-sizing: border-box;
      border-bottom: 1px solid #ccc;
    }
  </style>
</head>

<body>
  <div id="toolbar">
    <label>
      上傳 PDF 文件：
      <input type="file" id="file-input" accept="application/pdf">
    </label>
    <div>
      預覽比例：
      <select id="scale-select">
        <option value="0.5">50%</option>
        <option value="0.75">75%</option>
        <option value="1" selected>100%</option>
        <option value="1.5">150%</option>
        <option value="fit-width">適合視窗寬度</option>
        <option value="fit-height">適合視窗大小</option>
      </select>
      <button id="save-pdf-button">另存 PDF</button>
    </div>
  </div>

  <div id="container">
    <!-- 書籤管理區 -->
    <div id="bookmark-panel">
      <div id="bookmark-header">
        <input type="text" id="new-bookmark-title" placeholder="新增書籤標題">
        <input type="number" id="new-bookmark-page" placeholder="新增書籤頁碼" min="1">
        <button id="add-bookmark-button">新增書籤</button>
      </div>
      <div id="bookmark-list-container">
        <ul id="bookmark-list"></ul>
      </div>
    </div>

    <!-- PDF 預覽區 -->
    <div id="pdf-preview">
      <div id="page-controls">
        <button id="prev-page">上一頁</button>
        <span>頁碼：<span id="current-page">1</span> / <span id="total-pages">0</span></span>
        <button id="next-page">下一頁</button>
      </div>
      <div id="pdf-canvas-container">
        <canvas id="pdf-canvas"></canvas>
      </div>
    </div>
  </div>

  <script>
    const fileInput = document.getElementById("file-input");
    const pdfCanvas = document.getElementById("pdf-canvas");
    const ctx = pdfCanvas.getContext("2d");
    const currentPageSpan = document.getElementById("current-page");
    const totalPagesSpan = document.getElementById("total-pages");
    const prevPageButton = document.getElementById("prev-page");
    const nextPageButton = document.getElementById("next-page");
    const bookmarkList = document.getElementById("bookmark-list");
    const scaleSelect = document.getElementById("scale-select");
    const addBookmarkButton = document.getElementById("add-bookmark-button");
    const newBookmarkTitle = document.getElementById("new-bookmark-title");
    const newBookmarkPage = document.getElementById("new-bookmark-page");
    const savePdfButton = document.getElementById("save-pdf-button");

    let pdfDoc = null;
    let currentPage = 1;
    let scale = 1; // Default scale
    let bookmarks = [];

    // 渲染頁面
    async function renderPage(pageNum) {
      const page = await pdfDoc.getPage(pageNum);
      const viewport = page.getViewport({ scale });
      pdfCanvas.width = viewport.width * window.devicePixelRatio;
      pdfCanvas.height = viewport.height * window.devicePixelRatio;
      pdfCanvas.style.width = `${viewport.width}px`;
      pdfCanvas.style.height = `${viewport.height}px`;
      ctx.setTransform(window.devicePixelRatio, 0, 0, window.devicePixelRatio, 0, 0);

      const renderContext = {
        canvasContext: ctx,
        viewport: viewport,
      };

      await page.render(renderContext).promise;

      currentPageSpan.textContent = pageNum;
      totalPagesSpan.textContent = pdfDoc.numPages;
    }

    // 書籤展開/縮起
    function renderBookmarks(outline, parentElement = bookmarkList) {
      parentElement.innerHTML = "";
      outline.forEach((item, index) => {
        const li = document.createElement("li");
        li.classList.add("bookmark-item");
        li.innerHTML = `<span>${item.title} (第${item.dest.pageNumber || "未知"}頁)</span>`;
        const controls = document.createElement("div");
        controls.className = "controls";

        // 點擊跳轉到頁面
        li.addEventListener("click", () => {
          currentPage = item.dest.pageNumber || 1;
          renderPage(currentPage);
        });

        // 編輯按鈕
        const editButton = document.createElement("button");
        editButton.textContent = "編輯";
        editButton.addEventListener("click", () => {
          const newTitle = prompt("輸入新的書籤標題：", item.title);
          const newPage = parseInt(prompt("輸入新的頁碼：", item.dest.pageNumber), 10);
          if (newTitle && !isNaN(newPage) && newPage > 0 && newPage <= pdfDoc.numPages) {
            item.title = newTitle;
            item.dest.pageNumber = newPage;
            renderBookmarks(outline);
          }
        });

        // 刪除按鈕
        const deleteButton = document.createElement("button");
        deleteButton.textContent = "刪除";
        deleteButton.addEventListener("click", () => {
          outline.splice(index, 1);
          renderBookmarks(outline);
        });

        controls.appendChild(editButton);
        controls.appendChild(deleteButton);
        li.appendChild(controls);

        parentElement.appendChild(li);

        // 處理子書籤
        if (item.children && item.children.length > 0) {
          const subList = document.createElement("ul");
          li.appendChild(subList);
          renderBookmarks(item.children, subList);
        }
      });
    }

    // 上傳 PDF
    fileInput.addEventListener("change", async (event) => {
      const file = event.target.files[0];
      if (file) {
        const arrayBuffer = await file.arrayBuffer();
        pdfDoc = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;

        currentPage = 1;
        renderPage(currentPage);

        const outline = await pdfDoc.getOutline();
        if (outline) {
          bookmarks = outline.map((item) => ({
            title: item.title,
            dest: item.dest || { pageNumber: 1 },
            children: item.items || [],
          }));
          renderBookmarks(bookmarks);
        }
      }
    });

    // 更改比例
    scaleSelect.addEventListener("change", () => {
      scale = parseFloat(scaleSelect.value) || 1;
      renderPage(currentPage);
    });

    // 頁面切換
    prevPageButton.addEventListener("click", () => {
      if (currentPage > 1) {
        currentPage--;
        renderPage(currentPage);
      }
    });

    nextPageButton.addEventListener("click", () => {
      if (currentPage < pdfDoc.numPages) {
        currentPage++;
        renderPage(currentPage);
      }
    });

    // 新增書籤
    addBookmarkButton.addEventListener("click", () => {
      const title = newBookmarkTitle.value.trim();
      const page = parseInt(newBookmarkPage.value, 10);

      if (!title || isNaN(page) || page <= 0 || page > pdfDoc.numPages) {
        alert("請輸入有效的書籤標題和頁碼！");
        return;
      }

      bookmarks.push({ title, dest: { pageNumber: page }, children: [] });
      renderBookmarks(bookmarks);

      newBookmarkTitle.value = "";
      newBookmarkPage.value = "";
    });

    // 儲存 PDF
    savePdfButton.addEventListener("click", async () => {
      const pdfBytes = await pdfDoc.save();
      const blob = new Blob([pdfBytes], { type: "application/pdf" });
      const link = document.createElement("a");
      link.href = URL.createObjectURL(blob);
      link.download = "edited.pdf";
      link.click();
    });
  </script>
</body>

</html>
